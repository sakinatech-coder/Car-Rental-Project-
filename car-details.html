<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Car Details | DriveEasy</title>

    <link rel="stylesheet" href="cars.css">
</head>

<body>

<!-- ================= HEADER ================= -->

<header>

    <h2 class="logo">DriveEasy</h2>

    <nav>
        <a href="index.html">Home</a>
        <a href="cars.html">Cars</a>
        <a href="index.html#about">About</a>
        <a href="index.html#contact">Contact</a>
    </nav>

</header>


<!-- ================= CAR DETAILS ================= -->

<section class="cars">

    <h1 id="pageTitle">Car Details</h1>

    <div class="car-container">

        <div class="car-card">

            <img
                id="carImage"
                src="images/Thar-dashboard.jpg"
                alt="Car Dashboard"
            >

            <h2 id="carName">
                Mahindra Thar
            </h2>

            <p id="carPrice">
                ₹3500 / Day
            </p>

            <p id="carSpecs">
                Manual | Diesel | 4 Seats
            </p>

            <p>
                ✨ Premium & Well Maintained Car
            </p>

            <p>
                🛡️ Safe & Reliable
            </p>

            <p>
                📞 24/7 Customer Support
            </p>

            <br>

            <a href="book.html" class="btn">
                Book This Car 🚗
            </a>

        </div>

    </div>

</section>


<!-- ================= JAVASCRIPT ================= -->

<script>

const params =
    new URLSearchParams(window.location.search);

const car =
    params.get("car");


const carImage =
    document.getElementById("carImage");

const carName =
    document.getElementById("carName");

const carPrice =
    document.getElementById("carPrice");

const carSpecs =
    document.getElementById("carSpecs");

const pageTitle =
    document.getElementById("pageTitle");


if (car === "Mahindra Thar") {

    pageTitle.textContent =
        "Mahindra Thar Details";

    carName.textContent =
        "Mahindra Thar";

    carImage.src =
        "images/Thar-dashboard.jpg";

    carImage.alt =
        "Mahindra Thar Dashboard";

    carPrice.textContent =
        "₹3500 / Day";

    carSpecs.textContent =
        "Manual | Diesel | 4 Seats";

}


else if (car === "Mahindra Scorpio") {

    pageTitle.textContent =
        "Mahindra Scorpio Details";

    carName.textContent =
        "Mahindra Scorpio";

    carImage.src =
        "images/scorpio-dashboard.jpg";

    carImage.alt =
        "Mahindra Scorpio Dashboard";

    carPrice.textContent =
        "₹3000 / Day";

    carSpecs.textContent =
        "Manual | Diesel | 7 Seats";

}


else if (car === "BMW 5 Series") {

    pageTitle.textContent =
        "BMW 5 Series Details";

    carName.textContent =
        "BMW 5 Series";

    carImage.src =
        "images/bmw-interior.jpg";

    carImage.alt =
        "BMW 5 Series Interior";

    carPrice.textContent =
        "₹9000 / Day";

    carSpecs.textContent =
        "Automatic | Petrol | 5 Seats";

}


else if (car === "Lamborghini Huracan") {

    pageTitle.textContent =
        "Lamborghini Huracan Details";

    carName.textContent =
        "Lamborghini Huracan";

    carImage.src =
        "images/lamborghini-Interior.jpg";

    carImage.alt =
        "Lamborghini Huracan Interior";

    carPrice.textContent =
        "₹25000 / Day";

    carSpecs.textContent =
        "Automatic | Petrol | 2 Seats";

}

</script>

</body>

</html>
