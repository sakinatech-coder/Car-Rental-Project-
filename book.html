<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Your Car - DriveEasy</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .booking-section {
            min-height: 100vh;
            padding: 120px 20px 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f4f4;
        }

        .booking-box {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .booking-box h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .booking-box p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .booking-form label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .booking-form input,
        .booking-form select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .booking-form input:focus,
        .booking-form select:focus {
            outline: none;
            border-color: #ff3c00;
        }

        .booking-form button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #ff3c00;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .booking-form button:hover {
            background: #d62f00;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #ff3c00;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header class="navbar">

    <div class="logo">
        <a href="index.html">DriveEasy</a>
    </div>

    <nav>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#cars">Cars</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#contact">Contact</a></li>
        </ul>
    </nav>

</header>


<section class="booking-section">

    <div class="booking-box">

        <h1>Book Your Car 🚗</h1>

        <p>Fill in your details to reserve your car.</p>

        <form class="booking-form" onsubmit="confirmBooking(event)">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                placeholder="Enter your phone number"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="car">Select Car</label>

            <select id="car" required>
                <option value="">Choose your car</option>
                <option value="Mahindra Thar">Mahindra Thar - ₹3500 / Day</option>
                <option value="BMW X5">BMW X5 - ₹7000 / Day</option>
                <option value="Scorpio N">Scorpio N - ₹4000 / Day</option>
            </select>

            <label for="pickup">Pickup Date</label>
            <input
                type="date"
                id="pickup"
                required
            >

            <label for="returnDate">Return Date</label>
            <input
                type="date"
                id="returnDate"
                required
            >

            <label for="location">Pickup Location</label>
            <input
                type="text"
                id="location"
                placeholder="Enter pickup location"
                required
            >

            <button type="submit">
                Confirm Booking
            </button>

        </form>

        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </div>

</section>


<script>
function confirmBooking(event) {

    event.preventDefault();

    let name = document.getElementById("name").value;
    let car = document.getElementById("car").value;
    let pickup = document.getElementById("pickup").value;
    let returnDate = document.getElementById("returnDate").value;

    if (returnDate < pickup) {
        alert("Return date cannot be before pickup date.");
        return;
    }

    alert(
        "Booking Confirmed! 🎉\n\n" +
        "Name: " + name + "\n" +
        "Car: " + car + "\n" +
        "Pickup Date: " + pickup + "\n" +
        "Return Date: " + returnDate
    );
}
</script>

</body>
</html>
    <nav>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#cars">Cars</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#contact">Contact</a></li>
            <li><a href="book.html" class="book-btn">Book Now</a></li>
        </ul>
    </nav>

</header>


<!-- Booking Section -->
<section class="booking-page">

    <div class="booking-box">

        <h1>Book Your Car</h1>

        <p class="subtitle">
            Fill in your details to reserve your favourite car.
        </p>

        <form class="booking-form" onsubmit="bookCar(event)">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                placeholder="Enter your phone number"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="car">Select Car</label>
            <select id="car" required>
                <option value="">Choose a car</option>
                <option value="Mahindra Thar">Mahindra Thar - ₹3500 / Day</option>
                <option value="BMW X5">BMW X5 - ₹7000 / Day</option>
                <option value="Scorpio N">Scorpio N - ₹4000 / Day</option>
                <option value="Lamborghini">Lamborghini - ₹15000 / Day</option>
            </select>

            <label for="pickup">Pickup Date</label>
            <input
                type="date"
                id="pickup"
                required
            >

            <label for="return">Return Date</label>
            <input
                type="date"
                id="return"
                required
            >

            <label for="message">Additional Message</label>
            <textarea
                id="message"
                placeholder="Any special request..."
            ></textarea>

            <button type="submit">
                Confirm Booking
            </button>

        </form>

        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </div>

</section>


<script>
function bookCar(event){

    event.preventDefault();

    let name = document.getElementById("name").value;
    let car = document.getElementById("car").value;
    let pickup = document.getElementById("pickup").value;
    let returnDate = document.getElementById("return").value;

    if(returnDate < pickup){
        alert("Return date cannot be before pickup date.");
        return;
    }

    alert(
        "Booking Confirmed!\\n\\n" +
        "Name: " + name + "\\n" +
        "Car: " + car + "\\n" +
        "Pickup: " + pickup + "\\n" +
        "Return: " + returnDate
    );
}
</script>

</body>
</html>
